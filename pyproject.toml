[build-system]
# setuptools >=70.1 vendors bdist_wheel, so a wheel build needs neither the
# retired `wheel` package nor network access under --no-build-isolation.
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "minicc"
dynamic = ["version"]
description = "A minimal Claude Code-style terminal coding agent (core modules adapted from specproof)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.50.0",
    "tenacity>=8.2.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
minicc = "minicc.main:main"
minicc-web = "minicc.web:main"

[project.optional-dependencies]
dev = [
    # Floor witnessed red-on-old-pytest, not chosen by preference.  Two families
    # pin it: the planted-defect probe in tests/test_pytest_invocation.py needs
    # >=8.4 (pytest <8.4 wraps pytest_configure in
    # catch_warnings(simplefilter("default")), which neutralizes the interpreter's
    # -W error before pytest-asyncio's configure-time warning is issued, so the
    # probe can never go red and its green means nothing), and the three caplog
    # tests in tests/test_project_config.py were red on 8.4.2 / green on 9.1.1.
    # Witness: full suite 1565 passed on 9.1.1.
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    # Tests exercise both native providers directly (test_anthropic_provider,
    # test_reasoning_effort); declare httpx so `pip install -e ".[dev]"` does not
    # rely on openai pulling it in transitively. `pip check` enforces this.
    "httpx>=0.27.0",
    # M4-3's criterion ("POST /api/* 路由 Python 测试覆盖率") was recorded as
    # unmeasurable for three audit batches because no coverage tool was
    # installed. Declared here so the number is reproducible. One command
    # reproduces the criterion (it runs the selection under coverage itself):
    #   python scripts/route_coverage.py --check
    # and `python -m coverage run --source=minicc -m pytest <selection>` followed
    # by `python -m coverage report --include="*webserver*"` gives the module's
    # line percentage, which is a different and weaker question - see the script's
    # docstring for why "the route's comparison line ran" is not coverage.
    "coverage[toml]>=7.0",
    # tests/test_packaging.py builds a wheel *in-process* (setuptools
    # build_meta), so the bdist_wheel command has to exist in the test
    # environment itself. GitHub's Python 3.11 image ships setuptools older than
    # 70.1, which does not vendor that command, so every packaging test errored
    # with `error: invalid command 'bdist_wheel'` on BOTH CI legs while passing
    # on the development machine, where `wheel` happened to be installed.
    # Reproduced in a throwaway venv with setuptools 69.5.1 and no wheel;
    # installing wheel fixes it. Same class of defect as httpx above.
    "wheel>=0.41",
]
# Native Anthropic Messages provider (minicc.llm.anthropic_provider).
anthropic = [
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["minicc*"]

[tool.setuptools.dynamic]
# Single source of truth for the version: minicc/__init__.py.__version__.
# pyproject, `minicc --version` and the MCP clientInfo all derive from it.
version = { attr = "minicc.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: report pass counts and a short summary (skips/xfails/warnings/errors)
# instead of the previous -q, which hid the warnings summary entirely.
addopts = "-ra"
pythonpath = ["."]
# pytest-asyncio warns at configure time when this is unset, and that warning is
# fatal under `python -W error -m pytest` (the flag on the interpreter, the common CI
# shape): the run died in pytest_configure with exit 3 and named not one test.
# Declared here so the suite is runnable under either shape.  See
# tests/test_pytest_invocation.py.
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Measure the package, not the test suite: the M4-3 number is about the HTTP
# surface in minicc/webserver.py.
source = ["minicc"]
branch = false

[tool.coverage.report]
# Keep the default report readable. The number M4-3 is quoted against is not
# this percentage: scripts/route_coverage.py maps each route branch to its own
# lines and asks whether a request entered it (see that file for why the naive
# per-line reading is gameable on an if/return chain).
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
