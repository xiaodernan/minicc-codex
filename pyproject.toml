[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicc"
version = "0.1.0"
description = "A minimal Claude Code-style terminal coding agent (core modules adapted from specproof)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.50.0",
    "tenacity>=8.2.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
minicc = "minicc.main:main"
minicc-web = "minicc.web:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["minicc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
