# Build context is the checkout root, so the inspector image can COPY minicc/.
# Run `mvn -DskipTests package` in minicc-cloud before `docker compose build`.
name: minicc-cloud

services:
  registry:
    build:
      context: ..
      dockerfile: minicc-cloud/minicc-cloud-registry/Dockerfile
    image: minicc-cloud-registry:0.1.0
    # 8761 is taken on some dev machines (this one included); override via env.
    ports:
      - "${MINICC_CLOUD_REGISTRY_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8761"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  config:
    build:
      context: ..
      dockerfile: minicc-cloud/minicc-cloud-config/Dockerfile
    image: minicc-cloud-config:0.1.0
    ports:
      - "${MINICC_CLOUD_CONFIG_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8888"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "${MINICC_CLOUD_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  rabbitmq:
    # 3-management-alpine's .erlang.cookie EACCES on docker desktop builds;
    # the plain alpine image runs the same broker (management UI is optional).
    # Also pin the erlang cookie — without this the .erlang.cookie in
    # /var/lib/rabbitmq/ comes up root-owned unreadable and the node
    # refuses to start on Docker Desktop / WSL2.
    image: rabbitmq:4.0-alpine
    ports:
      - "${MINICC_CLOUD_RABBITMQ_PORT:-5672}:5672"
      - "${MINICC_CLOUD_RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: minicc-compose-secret-key
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  inspector:
    build:
      context: ..
      dockerfile: minicc-cloud/minicc-cloud-inspector/Dockerfile
    image: minicc-cloud-inspector:0.1.0
    environment:
      EUREKA_ZONE: http://registry:8761/eureka/
      CONFIG_SERVER: http://config:8888
      MINICC_ALLOWEDROOTS: /workspaces
      # The one budget the Python child gets before it is destroyed (default 30s).
      # git status over a >100 MB checkout on a Windows bind mount can exceed
      # that by minutes; owners of slow mounts raise it here, not in the image.
      # (Relax-binding: minicc.cloud.inspector.timeout-seconds → this exact env name.)
      MINICC_CLOUD_INSPECTOR_TIMEOUTSECONDS: ${MINICC_CLOUD_INSPECTOR_TIMEOUTSECONDS:-30}
      # The inner git-status wall clock inside the inspector (default 20s,
      # python-side, minicc/changes.py reads it). Raise together with the
      # outer budget — never one alone.
      MINICC_GIT_STATUS_TIMEOUT_SECONDS: ${MINICC_GIT_STATUS_TIMEOUT_SECONDS:-20}
    volumes:
      # Read-only: the inspector only ever reads. Point this at a git checkout.
      - ${MINICC_WORKSPACE:-..}:/workspaces/target:ro
    depends_on:
      registry:
        condition: service_healthy
      config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  tasks:
    build:
      context: ..
      dockerfile: minicc-cloud/minicc-cloud-tasks/Dockerfile
    image: minicc-cloud-tasks:0.1.0
    ports:
      - "${MINICC_CLOUD_TASKS_PORT:-8082}:8082"
    environment:
      EUREKA_ZONE: http://registry:8761/eureka/
      CONFIG_SERVER: http://config:8888
      MINICC_STATE: /state
    volumes:
      # Read-only: the task service never writes; the Python engine owns it.
      - ${MINICC_STATE:-../.minicc}:/state:ro
    depends_on:
      registry:
        condition: service_healthy
      config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  insights:
    build:
      context: ..
      dockerfile: minicc-cloud/minicc-cloud-insights/Dockerfile
    image: minicc-cloud-insights:0.1.0
    ports:
      - "${MINICC_CLOUD_INSIGHTS_PORT:-8087}:8087"
    environment:
      EUREKA_ZONE: http://registry:8761/eureka/
      CONFIG_SERVER: http://config:8888
      MINICC_STATE: /state
    volumes:
      # Read-only: the insights service never writes; the Python engine owns it.
      - ${MINICC_STATE:-../.minicc}:/state:ro
    depends_on:
      registry:
        condition: service_healthy
      config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  gateway:
    build:
      context: ..
      dockerfile: minicc-cloud/minicc-cloud-gateway/Dockerfile
    image: minicc-cloud-gateway:0.1.0
    ports:
      - "${MINICC_CLOUD_GATEWAY_PORT:-8080}:8080"
    environment:
      EUREKA_ZONE: http://registry:8761/eureka/
      CONFIG_SERVER: http://config:8888
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      # Opt in to the Redis token bucket (20 rps refill, 40 burst, per-IP).
      # Override with MINICC_GATEWAY_RATE_LIMIT_REPLENISH / _BURST / _REQUESTED.
      SPRING_PROFILES_ACTIVE: ratelimit
      # Gateway response timeout / timelimiter, above the inspector's own budget
      # by the default margin (P1). Raise together with the inspector's budget
      # on slow mounts; never lower one without the other.
      # (Relax-binding: minicc.cloud.gateway.response-timeout-seconds → this exact env name.)
      MINICC_CLOUD_GATEWAY_RESPONSETIMEOUTSECONDS: ${MINICC_CLOUD_GATEWAY_RESPONSETIMEOUTSECONDS:-40}
    depends_on:
      registry:
        condition: service_healthy
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inspector:
        condition: service_healthy
      tasks:
        condition: service_healthy
      insights:
        condition: service_healthy