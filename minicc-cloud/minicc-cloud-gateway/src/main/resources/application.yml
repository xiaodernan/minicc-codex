server:
  port: 8080

spring:
  application:
    name: minicc-cloud-gateway
  config:
    # `optional:` is the point: a gateway started without the config server
    # (unit tests, a laptop) keeps the values below instead of refusing to
    # start.  When the server is up, its files win.
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}
  cloud:
    # Measured from spring-cloud-gateway-server-4.3.5's own
    # spring-configuration-metadata.json: since 4.2 the reactive server's keys
    # live under .server.webflux, not directly under spring.cloud.gateway.
    # LoadBalancer cache: Caffeine replaces the development-only in-memory
    # default; 30s TTL reflects the 30s Eureka lease renewal window — an
    # instance considered dead by a 30s-stale cache is very likely actually gone.
    # Health check: poll each candidate instance directly before trusting
    # Eureka's cached UP tag. A service whose /actuator/health starts failing
    # should stop receiving lb:// traffic within one poll interval even if
    # Eureka hasn't demoted it yet. `path.default` applies to every serviceId;
    # a per-service override would look like `path.minicc-cloud-insights: /health`.
    loadbalancer:
      health-check:
        interval: 10s
        path:
          default: /actuator/health
      cache:
        enabled: true
        ttl: ${minicc.cloud.gateway.loadbalancer-cache-ttl:30s}
        capacity: ${minicc.cloud.gateway.loadbalancer-cache-capacity:256}
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${minicc.cloud.gateway.connect-timeout-ms:2000}
            # Longer than the inspector's Python budget: a timeout here
            # would discard an answer the inspector was still able to produce.
            # The number comes from the config server (P1); the literal below
            # is the standalone fallback, not a second source of truth.
            response-timeout: ${minicc.cloud.gateway.response-timeout-seconds:40}s
          routes:
            - id: inspector-changes
              uri: lb://minicc-cloud-inspector
              predicates:
                - Path=/api/changes,/api/changes/**
              filters:
                # Refuse an oversized body before the circuit breaker counts it,
                # so one bad client cannot open the breaker for everyone.
                - name: RequestSize
                  args:
                    maxSize: ${minicc.cloud.gateway.max-request-bytes:1048576}
                - name: CircuitBreaker
                  args:
                    name: inspector-route
                    fallbackUri: forward:/fallback/inspector
            - id: tasks
              uri: lb://minicc-cloud-tasks
              predicates:
                - Path=/api/tasks,/api/tasks/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: ${minicc.cloud.gateway.max-request-bytes:1048576}
                - name: CircuitBreaker
                  args:
                    name: tasks-route
                    # The existing fallback answers 503 with a reason, never an
                    # empty array, which is the point for a read the gateway
                    # could not perform.
                    fallbackUri: forward:/fallback/inspector
            - id: insights
              uri: lb://minicc-cloud-insights
              predicates:
                - Path=/api/insights,/api/insights/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: ${minicc.cloud.gateway.max-request-bytes:1048576}
                - name: CircuitBreaker
                  args:
                    name: insights-route
                    fallbackUri: forward:/fallback/insights
  # M8-T822: these three keys used to live under a SECOND top-level `spring:`
  # block (formerly line 85). SnakeYAML rejects a duplicate top-level key, so
  # the gateway ApplicationContext failed to load at all ("found duplicate key
  # spring") — 17 tests red and a standalone gateway that could not start.
  # They are one `spring:` tree now; One Fact One Home for config, too.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      lettuce:
        shutdown-timeout: 200ms
  cache:
    type: redis
    cache-names: gateway-routes
    redis:
      time-to-live: 60s
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: manual

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  circuitbreaker:
    instances:
      inspector-route:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
      tasks-route:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
      insights-route:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      inspector-route:
        timeout-duration: ${minicc.cloud.gateway.response-timeout-seconds:40}s
        cancel-running-future: true
      tasks-route:
        timeout-duration: ${minicc.cloud.gateway.response-timeout-seconds:40}s
        cancel-running-future: true
      insights-route:
        timeout-duration: ${minicc.cloud.gateway.response-timeout-seconds:40}s
        cancel-running-future: true