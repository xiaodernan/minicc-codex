server:
  port: 8080

spring:
  application:
    name: minicc-cloud-gateway
  config:
    # `optional:` is the point: a gateway started without the config server
    # (unit tests, a laptop) keeps the values below instead of refusing to
    # start.  When the server is up, its files win.
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}
  cloud:
    # Measured from spring-cloud-gateway-server-4.3.5's own
    # spring-configuration-metadata.json: since 4.2 the reactive server's keys
    # live under .server.webflux, not directly under spring.cloud.gateway.
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${minicc.cloud.gateway.connect-timeout-ms:2000}
            # Longer than the inspector's Python budget: a timeout here
            # would discard an answer the inspector was still able to produce.
            # The number comes from the config server (P1); the literal below
            # is the standalone fallback, not a second source of truth.
            response-timeout: ${minicc.cloud.gateway.response-timeout-seconds:40}s
          routes:
            - id: inspector-changes
              uri: lb://minicc-cloud-inspector
              predicates:
                - Path=/api/changes,/api/changes/**
              filters:
                # Refuse an oversized body before the circuit breaker counts it,
                # so one bad client cannot open the breaker for everyone.
                - name: RequestSize
                  args:
                    maxSize: ${minicc.cloud.gateway.max-request-bytes:1048576}
                - name: CircuitBreaker
                  args:
                    name: inspector-route
                    fallbackUri: forward:/fallback/inspector
            - id: tasks
              uri: lb://minicc-cloud-tasks
              predicates:
                - Path=/api/tasks,/api/tasks/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: ${minicc.cloud.gateway.max-request-bytes:1048576}
                - name: CircuitBreaker
                  args:
                    name: tasks-route
                    # The existing fallback answers 503 with a reason, never an
                    # empty array, which is the point for a read the gateway
                    # could not perform.
                    fallbackUri: forward:/fallback/inspector

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  circuitbreaker:
    instances:
      inspector-route:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
      tasks-route:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      inspector-route:
        timeout-duration: ${minicc.cloud.gateway.response-timeout-seconds:40}s
        cancel-running-future: true
      tasks-route:
        timeout-duration: ${minicc.cloud.gateway.response-timeout-seconds:40}s
        cancel-running-future: true