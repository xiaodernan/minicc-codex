# M8-T822 — offline test isolation.  Different extension from the main
# application.yml on purpose: Spring Boot loads both (.properties wins on a
# key collision) instead of replacing one classpath resource with another.
# A same-named application.yml would shadow the shipped routes entirely, which
# is exactly what made GatewayRouteBindingTest see [].  Here we override only
# the two middleware bindings so the ApplicationContext starts without a local
# RabbitMQ broker / Redis server, while the three routes stay bound from
# src/main/resources/application.yml.
spring.rabbitmq.listener.simple.auto-startup=false
spring.cache.type=none
spring.data.redis.repositories.enabled=false
