server:
  port: 8081

spring:
  application:
    name: minicc-cloud-inspector
  config:
    # Optional so the module's own tests and a standalone run still start;
    # when the config server answers, its `minicc.cloud.inspector.*` keys are
    # additive, not a replacement for the locals below.
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

minicc:
  python: ${MINICC_PYTHON:python}
  repo: ${MINICC_REPO:${user.dir}}
  # The one budget the gateway's response timeout is derived from (P1).
  budget: ${minicc.cloud.inspector.timeout-seconds:30}s
  # The boundary is delivered by the config server; the empty default keeps a
  # standalone run working, where empty means the repo above is the only root.
  allowed-roots: ${MINICC_ALLOWEDROOTS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized

resilience4j:
  circuitbreaker:
    instances:
      minicc-python:
        register-health-indicator: true