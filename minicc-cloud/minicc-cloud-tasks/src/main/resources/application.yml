server:
  port: 8082

spring:
  application:
    name: minicc-cloud-tasks
  config:
    # Optional for the same reason the inspector's is: a standalone start
    # keeps the values below; when the config server answers, its
    # `minicc.cloud.tasks.*` keys are additive.
    import: optional:configserver:${CONFIG_SERVER:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

minicc:
  cloud:
    tasks:
      # The Python engine owns this file (`TaskStore` in minicc/task_store.py);
      # this service only ever opens it read-only.
      db: ${MINICC_STATE:../.minicc}/tasks.db
      # Standalone fallback, not a second source of truth: the served value
      # lives in the config server's minicc-cloud-tasks.yml.
      max-limit: ${MINICC_TASKS_MAX_LIMIT:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
