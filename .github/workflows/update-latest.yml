name: Update docs/latest.json

on:
  push:
    branches: [main]
    paths:
      - "docs/ROADMAP_TO_PRODUCT.md"
      - "docs/CHANGELOG.md"
      - "README.md"
      - "scripts/update-latest-json.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate latest.json
        run: node scripts/update-latest-json.mjs
      - name: Commit if changed
        run: |
          git fetch origin main
          if ! git diff --quiet -- docs/latest.json; then
            git config user.name "minicc-bot"
            git config user.email "minicc-bot@users.noreply.github.com"
            git add docs/latest.json
            git commit -m "chore(latest): refresh showcase fact pack"
            # Rebase onto whatever main moved to while this run was in flight,
            # then push. Regenerate the fact pack to resolve its own conflicting
            # file deterministically — latest.json is bot-owned and always
            # reproducible from the tree, so any resolution that regenerates is
            # correct by construction.
            if ! git pull --rebase origin main; then
              node scripts/update-latest-json.mjs
              git add docs/latest.json
              git -c core.editor=true rebase --continue
            fi
            git push
          else
            echo "latest.json unchanged"
          fi
